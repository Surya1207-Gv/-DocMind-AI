version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docmind-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/faiss_indices:/app/backend/faiss_indices
      - ./backend/docmind.db:/app/backend/docmind.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docmind-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
