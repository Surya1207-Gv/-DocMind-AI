name: DocMind Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Backend Tests with Pytest
      env:
        PYTHONPATH: .
        OPENROUTER_API_KEY: mock_openrouter_key
        GEMINI_API_KEY: mock_gemini_key
        JWT_SECRET_KEY: mock_secret_key
      run: |
        python -m pytest backend/tests/ -v --tb=short --cov=backend --cov-report=xml

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci || npm install

    - name: Run Frontend Tests with Vitest
      run: |
        cd frontend
        npm run test
