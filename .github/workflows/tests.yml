name: DocMind Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # Matches the python:3.12-slim base image used in the Dockerfile.
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements-dev.txt

    - name: Run backend tests
      env:
        PYTHONPATH: .
        # Placeholder values: the suite mocks every outbound provider call.
        OPENROUTER_API_KEY: mock_openrouter_key
        GEMINI_API_KEY: mock_gemini_key
        JWT_SECRET_KEY: mock_secret_key
      run: |
        python -m pytest backend/tests/ -v --tb=short --cov=backend --cov-report=xml --cov-report=term

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: coverage.xml
        if-no-files-found: ignore

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci || npm install
      working-directory: frontend

    - name: Run frontend tests
      run: npm run test
      working-directory: frontend

    # The production image builds the SPA, so a broken build must fail CI.
    - name: Verify production build
      run: npm run build
      working-directory: frontend
